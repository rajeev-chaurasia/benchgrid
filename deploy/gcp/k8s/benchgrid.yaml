# The GKE variant of deploy/k8s/benchgrid.yaml: the run store is the bucket
# rather than a shared volume, and the service is an internal load balancer
# so rig VMs in the VPC can reach it and nothing outside can. IMAGE and
# BUCKET are filled in by gke.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchgrid
  labels: {app.kubernetes.io/name: benchgrid}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: benchgrid}
  template:
    metadata:
      labels: {app.kubernetes.io/name: benchgrid}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: benchgrid
          image: IMAGE
          args: ["-listen", ":8080", "-artifacts", "gs://BUCKET/store", "-lease-ttl", "5s"]
          env:
            - name: BENCHGRID_DATABASE_URL
              valueFrom: {secretKeyRef: {name: benchgrid-db, key: url}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: benchgrid
  labels: {app.kubernetes.io/name: benchgrid}
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: benchgrid}
  ports: [{name: http, port: 8080, targetPort: http}]
