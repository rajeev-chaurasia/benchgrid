[project]
name = "benchgrid-tools"
version = "0.1.0"
description = "The CI regression gate, its evaluation harness, and the BigQuery exporter for benchgrid"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[project.scripts]
benchgrid-gate = "benchgrid_tools.gate:main"
benchgrid-evaluate = "benchgrid_tools.evaluate:main"
benchgrid-bq = "benchgrid_tools.bq:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchgrid_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
