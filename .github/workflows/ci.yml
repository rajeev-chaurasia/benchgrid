name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: ruby script/check_prose.rb

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Development runs Postgres 14. Claiming the lease statements behave the
        # same on the version CI would otherwise default to, without running
        # them there, is the kind of assumption this repository exists to avoid.
        postgres: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 15
    env:
      BENCHGRID_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Without this, a missing database skips every test that matters and the
      # job passes.
      BENCHGRID_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Recompute every published number and check the manifests
        run: go run ./script/validate_evidence evidence/results
      - name: Fail if the README quotes a number the evidence does not say
        run: go run ./script/readme_numbers -check
      - name: Check the manifests with a tool this repository did not write
        run: |
          for d in evidence/results/*/; do (cd "$d" && sha256sum -c --quiet SHA256SUMS); done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The gate's statistics, its control flow, and the exporter's verification
        working-directory: python
        run: uv run --locked pytest -q

  workloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every C++ profile builds warning free and is deterministic
        run: ./script/check_avbench.sh

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Kubernetes manifests decode strictly and match the binary, with no cluster
        working-directory: deploy/k8s/validate
        # The manifests live outside this test module, so the test cache cannot
        # see them change.
        run: go test -count=1 ./...
      - name: The systemd unit verifies against a real binary
        run: |
          make build
          sudo install -m 0755 bin/rigagent /usr/local/bin/rigagent
          sudo install -d /etc/benchgrid
          sudo install -m 0644 deploy/systemd/rigagent.env.example /etc/benchgrid/rigagent.env
          systemd-analyze verify deploy/systemd/rigagent.service
      - name: The whole stack runs in containers and completes experiments on Linux rigs
        run: ./script/compose_smoke.sh
